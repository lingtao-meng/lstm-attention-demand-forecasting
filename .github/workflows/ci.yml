name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  inventory-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy matplotlib lightgbm

      - name: Forecast error -> safety stock -> holding cost
        run: python scripts/forecast_to_inventory.py

      - name: Forecast diagnostics (FVA + newsvendor)
        run: python scripts/forecast_diagnostics.py

      - name: Diagnostics tests
        run: python tests/test_forecast_diagnostics.py

      - name: M5 tests
        working-directory: m5
        run: |
          python tests/test_m5.py
          python tests/test_evaluation.py
          python tests/test_probabilistic.py
          python tests/test_hierarchy.py

      - name: Check outputs
        run: |
          test -f results/summary.md
          test -f results/forecast_to_inventory_per_store.csv
          test -f results/forecast_diagnostics.json
          test -f images/fva_tracking.png
          test -f images/newsvendor.png
          test -f m5/results/diagnostics.json
          test -f m5/results/rolling_backtest.json
