name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  inventory-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy

      - name: Forecast error -> safety stock -> holding cost
        run: python scripts/forecast_to_inventory.py

      - name: Check outputs
        run: |
          test -f results/summary.md
          test -f results/forecast_to_inventory_per_store.csv
